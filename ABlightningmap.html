<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunderstorm Tracking Map – Link</title>
<style>
  @font-face { font-display: swap; }
  :root{
    --bg:#0B1220;
    --panel:#101B30;
    --panel-edge:#1E2C48;
    --amber:#F5A623;
    --cyan:#4FD1C5;
    --text:#E8EDF4;
    --muted:#6B7A99;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }
  body{ padding:32px; }

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background:linear-gradient(160deg, var(--panel) 0%, #0D1526 100%);
    border:1px solid var(--panel-edge);
    border-radius:16px;
    padding:28px 26px 24px;
    overflow:hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.7);
  }

  /* radar sweep signature element */
  .radar{
    position:relative;
    width:56px; height:56px;
    border-radius:50%;
    background: radial-gradient(circle at center, rgba(79,209,197,0.08) 0%, transparent 70%);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .radar::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(79,209,197,0.25);
  }
  .radar::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background: conic-gradient(from 0deg, rgba(79,209,197,0.55) 0deg, transparent 55deg, transparent 360deg);
    animation: sweep 2.4s linear infinite;
  }
  .radar-dot{
    position:relative;
    z-index:2;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px 2px rgba(245,166,35,0.7);
  }
  @keyframes sweep{ to{ transform:rotate(360deg); } }

  .top-row{
    display:flex; align-items:center; gap:14px; margin-bottom:18px;
  }
  .status{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--cyan);
    display:flex; align-items:center; gap:6px;
    text-transform:uppercase;
  }
  .status .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }

  h1{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--text);
    margin:0 0 6px;
    line-height:1.25;
  }
  p.desc{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.55;
    margin:0 0 22px;
  }

  .meta-row{
    display:flex;
    gap:18px;
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--panel-edge);
  }
  .meta-row span b{ color:var(--text); font-weight:500; }

  a.launch{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    text-decoration:none;
    background:var(--amber);
    color:#1A1305;
    font-weight:600;
    font-size:14px;
    font-family:'Inter',sans-serif;
    padding:13px 18px;
    border-radius:10px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  a.launch:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 24px -6px rgba(245,166,35,0.45);
    background:#FFB840;
  }
  a.launch:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }
  a.launch .arrow{ transition:transform 0.15s ease; }
  a.launch:hover .arrow{ transform:translateX(3px); }

  @media (prefers-reduced-motion: reduce){
    .radar::after, .status .dot{ animation:none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="top-row">
      <div class="radar"><div class="radar-dot"></div></div>
      <div>
        <div class="status"><span class="dot"></span>Live · Alberta</div>
      </div>
    </div>

    <h1>Thunderstorm Tracking Map</h1>
    <p class="desc">Real-time storm cell tracking, radar overlays, and active weather alerts for Alberta.</p>

    <a class="launch" href="https://ngsmetadvisor.github.io/chnwxproduct/TSRAmap.html">
      Open map
      <span class="arrow">→</span>
    </a>
  </div>

</body>
</html>
